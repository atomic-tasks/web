# Установка: uvx pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types: [text]
        exclude: ^(pnpm-lock\.yaml|openapi/openapi\.json|src/api/generated/)
      - id: eslint
        name: eslint
        entry: pnpm exec eslint --fix
        language: system
        types_or: [ts, tsx]
        exclude: ^src/api/generated/
