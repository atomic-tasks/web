# Заголовки безопасности (спека 0002, ADR 0005). Подключается include в КАЖДЫЙ location:
# add_header внутри location отменяет все add_header уровня server.
# always — заголовки и на 404/503, не только на 2xx/3xx.
# Хэши в style-src — два <style>, которые вставляет React Aria (usePress, usePreventScroll); сверяет
# deploy/csp.test.ts.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'sha256-38RhXrc7EdReTKsOm23ZPOCUgniTUUcjky8QOOrQx6o=' 'sha256-gYiS/BvZvRcK27JIXTuwhZ3hs2+VJ1X+2gUlE+farlg='; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Без includeSubDomains: на домене живут чужие хосты
add_header Strict-Transport-Security "max-age=31536000" always;
