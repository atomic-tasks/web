# Сервер сайта за Traefik (спека 0002, ADR 0005). HTTPS и маршрут /api/ в бэкенд — у Traefik.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    # Сюда /api/ доходит, только если у Traefik нет роутера бэкенда (остановлен или не выкачен).
    # 503 → клиент показывает «Нет связи с сервером», а не ошибку разбора index.html.
    location ^~ /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 503;
    }

    # Бандл с хэшем в имени: кэш на год. Нет файла — 404 без fallback,
    # иначе старая вкладка получит HTML вместо JS.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Всё остальное: файл, если есть, иначе index.html — адрес разберёт роутер в браузере.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
