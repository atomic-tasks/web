name: CI

on:
  push:
    branches: [main]
  pull_request:

# Проверкам запись не нужна (../guides/github-settings.md)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Версия pnpm — из packageManager в package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: API client is up to date
        run: |
          pnpm gen:api
          # status, а не diff: Orval может добавить или удалить файлы моделей
          if [ -n "$(git status --porcelain src/api/generated)" ]; then
            git status --porcelain src/api/generated
            echo "::error::Клиент API устарел. Запусти: pnpm gen:api"
            exit 1
          fi
      - run: pnpm build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action требует лицензию для организаций, поэтому CLI в контейнере
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose
